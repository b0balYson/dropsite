{{template "head" .}}
<main id="main" class="page">
  <header class="profile">
    <svg class="avatar" viewBox="0 0 96 96" width="96" height="96" aria-hidden="true" focusable="false">
      <circle cx="48" cy="48" r="48" style="fill: var(--accent)"/>
      <circle cx="48" cy="38" r="16" style="fill: var(--on-accent)"/>
      <path d="M18 84a30 26 0 0 1 60 0" style="fill: var(--on-accent)"/>
    </svg>
    <h1>{{.Title}}</h1>
    <p class="bio">{{.T.bio}}</p>
  </header>
  <nav aria-label="{{.T.links_title}}">
    <ul class="links">
      <li><a class="link" href="https://t.me/example">{{.T.l1}}</a></li>
      <li><a class="link" href="https://instagram.com/example">{{.T.l2}}</a></li>
      <li><a class="link" href="https://example.com/shop">{{.T.l3}}</a></li>
      <li><a class="link" href="tel:+70000000000">{{.T.l4}}</a></li>
      <li><a class="link" href="mailto:hello@example.com">{{.T.l5}}</a></li>
    </ul>
  </nav>
</main>
{{template "foot" .}}
