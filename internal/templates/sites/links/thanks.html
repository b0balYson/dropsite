{{template "head" (.Secondary .T.thanks_title)}}
<main id="main" class="page">
  <header class="profile">
    <svg class="avatar" viewBox="0 0 96 96" width="96" height="96" aria-hidden="true" focusable="false">
      <circle cx="48" cy="48" r="48" style="fill: var(--accent)"/>
      <path d="M28 50l14 14 28-30" fill="none" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" style="stroke: var(--on-accent)"/>
    </svg>
    <p class="bio">{{.Title}}</p>
    <h1>{{.T.thanks_title}}</h1>
    <p class="bio">{{.T.thanks_text}}</p>
  </header>
  <ul class="links">
    <li><a class="link link--main" href="/">{{.T.thanks_back}}</a></li>
  </ul>
</main>
{{template "foot" .}}
