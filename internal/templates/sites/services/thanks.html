{{template "head" (.Secondary .T.thanks_title)}}
<main id="main" class="hero hero--thanks">
  <div class="wrap">
    <span class="icon icon--done" aria-hidden="true">✓</span>
    <p class="eyebrow">{{.Title}}</p>
    <h1>{{.T.thanks_title}}</h1>
    <p class="lead">{{.T.thanks_text}}</p>
    <ol class="steps">
      <li>{{.T.step2}}</li>
      <li>{{.T.step3}}</li>
      <li>{{.T.step4}}</li>
    </ol>
    <p class="actions"><a class="btn" href="/">{{.T.thanks_back}}</a></p>
  </div>
</main>
{{template "foot" .}}
