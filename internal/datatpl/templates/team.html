<!-- Team from the collection __COLLECTION__. No styles on purpose: style it with the site's own CSS
     (the data-* attributes and elements are the hooks). Keep the fallback in sync with the data. -->
<section id="__COLLECTION__" aria-labelledby="__COLLECTION__-title">
  <h2 id="__COLLECTION__-title">Our team</h2>
  <ul data-items>
    <!-- Fallback content: shown when the data cannot be loaded and read by search engines. -->
    <li data-item>
      <figure>
        <img src="/images/team/maria.webp" alt="Portrait of Maria smiling" loading="lazy">
        <figcaption>
          <h3>Maria Ivanova</h3>
          <p data-role>Founder, lead designer</p>
        </figcaption>
      </figure>
    </li>
  </ul>
</section>
<script>
(() => {
  const NAME = '__COLLECTION__';
  const root = document.getElementById(NAME);
  const box = root.querySelector('[data-items]');
  const el = (tag, text, attr) => {
    const e = document.createElement(tag);
    if (text !== undefined && text !== null && text !== '') e.textContent = String(text);
    if (attr) e.setAttribute(attr, '');
    return e;
  };
  // Only site paths and https links: never javascript: or data: URLs from data.
  const safeURL = (u) => (typeof u === 'string' && (/^\/(?!\/)/.test(u) || /^https:\/\//.test(u)) ? u : '');

  async function loadAll() {
    const items = [];
    let after = '';
    for (let page = 0; page < 25; page++) {
      const r = await fetch('/_dropsite/data/' + NAME + '?limit=200' + (after ? '&after=' + encodeURIComponent(after) : ''));
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const body = await r.json();
      items.push(...body.items);
      if (!body.next) break;
      after = body.next;
    }
    return items;
  }

  function person(d) {
    const li = el('li', null, 'data-item');
    const figure = el('figure');
    const src = safeURL(d.photo);
    if (src) {
      const img = el('img');
      img.src = src;
      img.alt = d.photo_alt || '';
      img.loading = 'lazy';
      figure.append(img);
    }
    const caption = el('figcaption');
    caption.append(el('h3', d.name));
    if (d.role) caption.append(el('p', d.role, 'data-role'));
    figure.append(caption);
    li.append(figure);
    if (d.bio) li.append(el('p', d.bio, 'data-bio'));
    const links = (Array.isArray(d.links) ? d.links : []).filter((l) => safeURL(l.url));
    if (links.length) {
      const ul = el('ul', null, 'data-links');
      ul.append(...links.map((l) => {
        const a = el('a', l.label);
        a.href = safeURL(l.url);
        const item = el('li');
        item.append(a);
        return item;
      }));
      li.append(ul);
    }
    return li;
  }

  function render(items) {
    if (items.length === 0) return; // keep the fallback rather than an empty block
    box.replaceChildren(...items.map(({ data }) => person(data)));
  }

  // Values are set with textContent and properties only: never innerHTML with data.
  loadAll().then(render).catch(() => { /* keep the fallback content */ });
})();
</script>
