name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Test
        run: go test -race -count=1 ./...
      - name: CLI binaries and checksums
        run: make cli-release VERSION=${{ github.ref_name }}
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/dropsite-*
            dist/SHA256SUMS
          generate_release_notes: true
