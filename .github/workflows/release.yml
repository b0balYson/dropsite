name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Test
        run: go test -race -count=1 ./...
      - name: CLI binaries and checksums
        run: make cli-release VERSION=${{ github.ref_name }}
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/dropsite-*
            dist/SHA256SUMS
          generate_release_notes: true
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/dropsite-control
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ github.ref_name }}
      # Caddy with DNS plugins for TLS_MODE=wildcard, tagged by its Caddy
      # version (compose.wildcard.yml pins it) and by the dropsite release.
      - id: caddy-meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/dropsite-caddy
          tags: |
            type=raw,value=2.11.9
            type=semver,pattern={{version}}
            type=raw,value=latest
      - uses: docker/build-push-action@v7
        with:
          context: deploy/caddy
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.caddy-meta.outputs.tags }}
          labels: ${{ steps.caddy-meta.outputs.labels }}
